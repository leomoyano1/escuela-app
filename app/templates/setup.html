{% extends "base.html" %}
{% block title %}Configuración inicial · Galileo Galilei{% endblock %}
{% block content %}
<h1>Crear la primera cuenta</h1>
<p>Esta cuenta habilita el acceso local. Luego podrás crear cuentas individuales para el personal.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="username">Usuario</label>
  <input id="username" name="username" autocomplete="username" minlength="3" maxlength="64" required>
  <label for="password">Contraseña (mínimo 12 caracteres)</label>
  <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
  <label for="confirm_password">Confirmar contraseña</label>
  <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
  <div class="actions"><button type="submit">Crear cuenta y entrar</button></div>
</form>
{% endblock %}
