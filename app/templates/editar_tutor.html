{% extends "base.html" %}
{% block title %}Editar tutor · Galileo Galilei{% endblock %}
{% block content %}
<p><a href="{{ url_for('main.alumnos') }}">Volver a alumnos y tutores</a></p>
<h1>Editar tutor/responsable</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="nombre">Nombre</label>
  <input id="nombre" name="nombre" maxlength="200" value="{{ tutor.nombre }}" required>
  <label for="dni_cuit">DNI/CUIT</label>
  <input id="dni_cuit" name="dni_cuit" maxlength="20" value="{{ tutor.dni_cuit }}" required>
  <label for="telefono">Teléfono/WhatsApp</label>
  <input id="telefono" name="telefono" maxlength="50" value="{{ tutor.telefono or '' }}" required>
  <label for="direccion">Domicilio</label>
  <input id="direccion" name="direccion" maxlength="255" value="{{ tutor.direccion or '' }}" required>
  <label for="email">Correo electrónico (opcional)</label>
  <input id="email" name="email" type="email" maxlength="200" value="{{ tutor.email or '' }}">
  <div class="actions">
    <button type="submit">Guardar cambios</button>
    <a class="button secondary" href="{{ url_for('main.alumnos') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
