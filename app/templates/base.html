<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Galileo Galilei{% endblock %}</title>
  {% block styles %}{% endblock %}
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; color: #172033; background: #f3f5f8; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(94vw, 58rem); box-sizing: border-box; padding: 2rem; background: white; border-radius: .75rem; box-shadow: 0 1rem 2.5rem #18243a14; }
    h1 { margin-top: 0; font-size: 1.6rem; }
    label { display: block; margin: 1rem 0 .35rem; font-weight: 600; }
    input, select { box-sizing: border-box; width: 100%; padding: .7rem; border: 1px solid #b8c2d1; border-radius: .35rem; font: inherit; }
    input[type="checkbox"] { width: auto; }
    button, .button { display: inline-block; border: 0; border-radius: .35rem; padding: .7rem 1rem; background: #174a86; color: white; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
    .secondary { background: #e8edf4; color: #172033; }
    .error { padding: .75rem; border-left: .25rem solid #b42318; background: #fff1f0; color: #7a271a; }
    .muted { color: #526078; }
    .actions { display: flex; gap: .75rem; align-items: center; margin-top: 1.25rem; }
    .actions form { margin: 0; }
    section { border-top: 1px solid #e4e9f0; margin-top: 1.5rem; padding-top: 1rem; }
    .catalog-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .75rem; align-items: end; margin: 1rem 0; }
    .catalog-row label { margin: 0; }
    ul { padding-left: 1.25rem; }
    li { margin: .45rem 0; }
  </style>
</head>
<body>
  <main>
    <p class="muted">Colegio Galileo Galilei · Gestión escolar local</p>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
